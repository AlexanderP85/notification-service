server {
    listen 80;
    listen [::]:80;

    server_name localhost;
    root /var/www/html/public;

    index index.php index.html;

    # Логи (помогают отлаживать)
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Общие настройки для всех location
    client_max_body_size 10M;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;

    # Обработка статических файлов (если будут в будущем)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Обработка .php файлов через PHP-FPM
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # Используем PHP-FPM (рекомендуемый способ для продакшена)
        fastcgi_pass php-fpm:9000;

        fastcgi_index index.php;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;

        # Заголовки для корректной работы API
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PORT $server_port;

        fastcgi_intercept_errors off;
        fastcgi_buffering off;
        fastcgi_request_buffering off;
    }

    # Запрет доступа к скрытым файлам (.env, .git и т.д.)
    location ~ /\. {
        deny all;
    }

    # Запрет доступа к директориям vendor, storage, bootstrap/cache
    location ~ ^/(vendor|storage|bootstrap/cache) {
        deny all;
    }

    # Запрет доступа к .sql, .log, .lock файлам
    location ~* \.(sql|log|lock|bak|old)$ {
        deny all;
    }

    # Обработка Health Check для Kubernetes/Docker
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # CORS заголовки для API (если нужно)
    location /api {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS';
            add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Idempotency-Key';
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Idempotency-Key' always;
        add_header Access-Control-Expose-Headers 'Content-Length,Content-Range' always;

        try_files $uri $uri/ /index.php?$query_string;
    }

    # Gzip сжатие (ускоряет передачу JSON)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/plain
        text/css
        text/xml
        text/javascript;
    gzip_comp_level 6;
}