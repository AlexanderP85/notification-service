[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ============================================
; Queue Workers (High Priority)
; ============================================
[program:queue-worker-high]
command=php artisan queue:work --queue=notifications.high --sleep=1 --tries=3 --max-jobs=500 --max-time=3600 --memory=256
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=www-data
priority=10
stopwaitsecs=60
stopasgroup=true
killasgroup=true

; ============================================
; Queue Workers (Medium Priority)
; ============================================
[program:queue-worker-medium]
command=php artisan queue:work --queue=notifications.medium --sleep=2 --tries=3 --max-jobs=500 --max-time=3600 --memory=256
process_name=%(program_name)s_%(process_num)02d
numprocs=1
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=www-data
priority=20
stopwaitsecs=60
stopasgroup=true
killasgroup=true

; ============================================
; Queue Workers (Low Priority)
; ============================================
[program:queue-worker-low]
command=php artisan queue:work --queue=notifications.low --sleep=3 --tries=3 --max-jobs=500 --max-time=3600 --memory=256
process_name=%(program_name)s_%(process_num)02d
numprocs=1
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=www-data
priority=30
stopwaitsecs=60
stopasgroup=true
killasgroup=true

