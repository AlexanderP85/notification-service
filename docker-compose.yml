networks:
    app-network:
        driver: bridge

volumes:
    postgres_data:
    redis_data:
    rabbitmq_data:

services:
    # ---------- Веб-сервер Nginx ----------
    nginx:
        image: nginx:alpine
        container_name: notification_nginx
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - .:/var/www/html
        depends_on:
            - php-fpm
        networks:
            - app-network
        restart: unless-stopped

    # ---------- PHP-FPM (обработка PHP) ----------
    php-fpm:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: php-fpm
        container_name: notification_php_fpm
        volumes:
            - .:/var/www/html
        environment:
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: notifications
            DB_USERNAME: app
            DB_PASSWORD: secret
            REDIS_HOST: redis
            REDIS_PORT: 6379
            RABBITMQ_HOST: rabbitmq
            RABBITMQ_PORT: 5672
            RABBITMQ_VHOST: /
            RABBITMQ_LOGIN: guest
            RABBITMQ_PASSWORD: guest
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        networks:
            - app-network
        restart: unless-stopped

    # ---------- Supervisor (управляет воркерами очередей) ----------
    supervisor:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: supervisor
        container_name: notification_supervisor
        volumes:
            - .:/var/www/html
            - ./docker/supervisor/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro
        environment:
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: notifications
            DB_USERNAME: app
            DB_PASSWORD: secret
            REDIS_HOST: redis
            REDIS_PORT: 6379
            RABBITMQ_HOST: rabbitmq
            RABBITMQ_PORT: 5672
            RABBITMQ_VHOST: /
            RABBITMQ_LOGIN: guest
            RABBITMQ_PASSWORD: guest
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            php-fpm:
                condition: service_started
        networks:
            - app-network
        restart: unless-stopped

    # ---------- PostgreSQL ----------
    postgres:
        image: postgres:16-alpine
        container_name: notification_postgres
        ports:
            - "5432:5432"
        environment:
            POSTGRES_DB: notifications
            POSTGRES_USER: app
            POSTGRES_PASSWORD: secret
            POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U app -d notifications"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - app-network
        restart: unless-stopped

    # ---------- Redis ----------
    redis:
        image: redis:7-alpine
        container_name: notification_redis
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        command: redis-server --appendonly yes --requirepass ""
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - app-network
        restart: unless-stopped

    # ---------- RabbitMQ ----------
    rabbitmq:
        image: rabbitmq:3.13-management-alpine
        container_name: notification_rabbitmq
        ports:
            - "5672:5672"
            - "15672:15672"
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
            - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
        environment:
            RABBITMQ_DEFAULT_USER: guest
            RABBITMQ_DEFAULT_PASS: guest
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - app-network
        restart: unless-stopped
